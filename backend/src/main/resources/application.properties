spring.application.name=panenku-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/panenku}
spring.datasource.username=${DB_USER:panenku}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
panenku.jwt.secret=${JWT_SECRET}
panenku.jwt.issuer=${JWT_ISSUER:panenku}

# Compatibility with Geisar's auth/storage configuration.
app.jwt.secret=${panenku.jwt.secret}
app.jwt.issuer=${panenku.jwt.issuer}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
minio.endpoint=${MINIO_ENDPOINT:localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:panenku-files}

app.minio.endpoint=${minio.endpoint}
app.minio.access-key=${minio.access-key}
app.minio.secret-key=${minio.secret-key}
app.minio.bucket=${minio.bucket}
# Optional local private QRIS/payment/refund image storage for development; never put this under a web root.
panenku.storage.local-dir=${PAYMENT_STORAGE_LOCAL_DIR:}
# Explicit opt-in for development with dummy KTP images only.
panenku.ktp.dummy-enabled=${KTP_DUMMY_ENABLED:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
scheduler.enabled=${SCHEDULER_ENABLED:true}
scheduler.expiration.fixedDelay=${EXPIRATION_DELAY_MS:300000}
scheduler.expiration.initialDelay=${EXPIRATION_INITIAL_DELAY_MS:300000}
scheduler.expiration.batchSize=${EXPIRATION_BATCH_SIZE:100}

# Monetary Long fields must not silently truncate decimal/null input.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=true

# F1 product photos use a private dedicated bucket and opt-in storage.
panenku.product-photos.enabled=${PRODUCT_PHOTOS_ENABLED:false}
panenku.product-photos.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
panenku.product-photos.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
panenku.product-photos.access-key=${MINIO_ACCESS_KEY:}
panenku.product-photos.secret-key=${MINIO_SECRET_KEY:}
panenku.product-photos.bucket=${PRODUCT_PHOTOS_BUCKET:panenku-products}
panenku.product-photos.local-dir=${PRODUCT_PHOTOS_LOCAL_DIR:}
panenku.product-photos.local-base-url=${PRODUCT_PHOTOS_LOCAL_BASE_URL:http://127.0.0.1:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
panenku.dev-clock-offset=${PANENKU_DEV_CLOCK_OFFSET:PT0S}
