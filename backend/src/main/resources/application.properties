spring.application.name=panenku-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/panenku}
spring.datasource.username=${DB_USER:panenku}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
panenku.jwt.secret=${JWT_SECRET}
panenku.jwt.issuer=${JWT_ISSUER:panenku}

# Compatibility with Geisar's auth/storage configuration.
app.jwt.secret=${panenku.jwt.secret}
app.jwt.issuer=${panenku.jwt.issuer}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
minio.endpoint=${MINIO_ENDPOINT:localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:panenku-files}

app.minio.endpoint=${minio.endpoint}
app.minio.access-key=${minio.access-key}
app.minio.secret-key=${minio.secret-key}
app.minio.bucket=${minio.bucket}
scheduler.enabled=${SCHEDULER_ENABLED:true}
scheduler.expiration.fixedDelay=${EXPIRATION_DELAY_MS:300000}
scheduler.expiration.initialDelay=${EXPIRATION_INITIAL_DELAY_MS:300000}
scheduler.expiration.batchSize=${EXPIRATION_BATCH_SIZE:100}
