services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: panenku
      POSTGRES_USER: ${DB_USER:-panenku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - panenku_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d panenku"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  panenku_pg:
